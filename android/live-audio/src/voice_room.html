/* Modern live layout, preserving audio/video state and native bridge. */
:root{--bg:#0b1118;--panel:#151e29;--panel2:#202d3b;--line:#ffffff14;--text:#f1f5fa;--muted:#a7b5c7;--mint:#63e6c6}
body{background:radial-gradient(ellipse at 80% 0%,#163b3b66,transparent 48%),var(--bg)}
header{padding:18px 16px 12px;flex-shrink:0}.brand{font-weight:800;letter-spacing:-.4px}.brandMark{background:#63e6c6;color:#123b32;box-shadow:none;border-radius:12px}.liveBadge{background:#402632;color:#ffb5c4;box-shadow:none;border:1px solid #ffb5c422;letter-spacing:1px}.more{min-width:44px;min-height:44px;background:#ffffff08;border-radius:14px}.title{margin-top:16px;font-size:22px;letter-spacing:-.5px}.meta{gap:10px;flex-wrap:wrap;line-height:1.6}.people{min-height:44px;color:var(--mint)}

.stage .seat{background-color:#102030b8}

/* Muwahid LIVE Studio 2026: design applies to the actual embedded WebView, not the launcher. */
:root{--bg:#080c1c;--panel:#121628;--panel2:#1a1c32;--line:#393047;--text:#f7f5ff;--muted:#ada9c6;--mint:#b778ff}
html,body{background:#080c1c!important;color:var(--text)}
body{background:radial-gradient(circle at 50% 100%,#28133066,transparent 46%),#080c1c!important}
header{width:100%;padding:16px 16px 8px;max-width:none!important}
.topBar{gap:9px}.studioBack{flex:none;min-width:42px;min-height:44px;border:0;background:transparent;color:#fff;font-size:37px;line-height:1}
.topBar .brand{font-size:23px;letter-spacing:-.8px;font-weight:850;color:#d4bdff;min-width:0}
.topBar .people{padding:9px 12px;min-height:40px;border-radius:24px;background:#1a1a2f;border:1px solid #36324d;color:#f9f6ff;font-size:13px;min-width:56px}
.topBar .more{color:#fff;background:#171629;border-radius:50%;width:40px;height:40px;font-size:24px}
header .title{font-size:18px;letter-spacing:-.3px;margin-top:6px;padding:0 6px}
header .meta{margin-top:4px;padding:0 6px;color:#b1adc6}
header .liveBadge{font-size:10px;letter-spacing:.6px;padding:4px 9px;background:#e52f45;border:0;color:white;border-radius:9px}
header .timer{color:#e6d9ff}
#banner{margin:2px 17px 6px;max-width:none;background:transparent;border:0;color:#d4b9ff;font-size:11px;padding:2px 4px;min-height:14px}
#banner:empty{display:none}
.audioHelp{border:1px solid #52486b;background:#1b1930;color:#f2ebff;margin:4px 17px 6px;border-radius:14px;flex-shrink:0}
.audioHelp button{background:#522888;border-color:#ad82fa;color:white}
.stage{width:100%;max-width:none!important;flex:1;min-height:0;padding:0 15px 9px!important;overflow-y:auto!important}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px;padding:5px 0 8px}
.grid .seat,.grid.compact-grid .seat{min-height:clamp(124px,21vh,192px);border-radius:20px;border:1px solid #363047;opacity:1;background:linear-gradient(145deg,#181b2c,#101424);box-shadow:none}
.grid .seat.empty,.grid.compact-grid .seat.empty{min-height:clamp(124px,21vh,192px);border-style:solid;opacity:.72;background:linear-gradient(145deg,#1a1c30,#131525)}
.grid .seat .avatar,.grid.compact-grid .seat .avatar{width:65px;height:65px;font-size:23px;background:linear-gradient(140deg,#aa92d0,#777ba9);border:1px solid #9e8aca;color:#101328}
.grid .seat.empty .avatar{background:#272942;border-color:#302b49;color:#8b83a8}
.grid .seat .name,.grid.compact-grid .seat .name{left:11px;bottom:11px;right:auto;max-width:80%;font-size:12px;font-weight:650;background:transparent;padding:0;color:white}
.grid .seat.empty .name,.grid.compact-grid .seat.empty .name{color:#a6a0bb}
.grid .seat .role.hostRole{display:block;top:8px;left:9px;bottom:auto;color:#ffe3a0;font-size:11px;font-weight:750;background:#151420c9;border-radius:9px;padding:4px 7px}
.grid .seat.micOn{border-color:#a552fd;box-shadow:0 0 0 1px #a552fd88}
.grid .seat .badge{right:10px;bottom:8px;color:#fa566b;background:none;font-size:15px}
.grid .seat.micOn .badge{color:#55e27d}
.grid .seat video,.grid.compact-grid .seat video{border-radius:19px}
.controls,.controls[style]{position:relative!important;left:auto;right:auto;bottom:auto;background:linear-gradient(#0b0c1c,#100a23);display:flex;flex-direction:column;flex-shrink:0;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #242037}
.primaryActions{display:flex;align-items:stretch;justify-content:space-around;gap:3px;width:100%}
.primaryActions button.action{flex:1;min-width:0;max-width:112px;min-height:76px;font-size:10px;gap:5px;color:#f8f3ff}
.primaryActions .action .ctlIcon{width:44px;height:44px;background:#252437;border:1px solid #333147;border-radius:15px;color:white}
.primaryActions .action .ctlIcon svg{height:22px;width:22px}
.primaryActions .action.on .ctlIcon{background:#512879;border-color:#ac5bff;color:#fff}
.primaryActions .action.blocked .ctlIcon{opacity:.5}
.endLive{display:block;align-self:center;width:min(78%,330px);min-height:54px;border:0;border-radius:30px;background:#e53647;color:white;font-size:17px;font-weight:800}
#sheet,#toolSheet{background:#111126;border:1px solid #38314c}
.sheetBtns button,.chip,.panelCard{border-color:#363047;background:#222037;color:#f7f3ff}
.toolIcon{background:#2a203c;border-color:#473258}.toolIcon svg{stroke:#bb8bfa}
.video-room .seat video{object-fit:cover}
@media(min-width:700px){.stage{max-width:900px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.grid .seat{min-height:170px}}
@media(max-height:660px){.grid .seat,.grid.compact-grid .seat{min-height:132px}.controls{padding-top:5px;gap:4px}.primaryActions button.action{min-height:62px}.endLive{min-height:46px}}

/* Shared reading is an ordinary collapsible panel, never a blocking dialog. */
.readingHead{position:sticky;top:0;z-index:3;background:#151628;border-radius:12px;padding:5px 0;min-height:48px}
.readingClose{display:inline-flex;align-items:center;justify-content:center;min-width:78px;min-height:44px;padding:8px 12px;border:1px solid #76638e;border-radius:12px;background:#28203d;color:#fff;font-size:13px;font-weight:800;cursor:pointer}
.readingClose:focus-visible{outline:2px solid #c5a0ff;outline-offset:2px}
/* The active room preset must override the hard-coded legacy purple studio styles. */
body.room-theme-active .grid .seat,
body.room-theme-active .grid.compact-grid .seat,
body.room-theme-active .grid .seat.empty {background:var(--room-seat-bg)!important;}
body.room-theme-active #liveBackground{opacity:1;}
#serverNotice{margin:0 14px 8px;padding:8px 12px;font-size:12px;line-height:1.4;color:#dce6ff;border-radius:12px;background:#293453d9;border:1px solid #5671a17a;white-space:normal}#serverNotice.hidden{display:none}

/* Voice-only eight-seat circle: the actual peers stay in their assigned seat. */
#grid.round-8{position:relative;display:block!important;grid-template-columns:none!important;aspect-ratio:1/1;width:min(100%,420px);margin:6px auto 12px;padding:0!important;isolation:isolate}

#grid.round-8 .seat.empty{border-style:dashed;opacity:.65}
#grid.round-8 .seat[data-seat="1"]{left:50%;top:15%}
#grid.round-8 .seat[data-seat="2"]{left:76%;top:24%}
#grid.round-8 .seat[data-seat="3"]{left:87%;top:50%}
#grid.round-8 .seat[data-seat="4"]{left:76%;top:76%}
#grid.round-8 .seat[data-seat="5"]{left:50%;top:85%}
#grid.round-8 .seat[data-seat="6"]{left:24%;top:76%}
#grid.round-8 .seat[data-seat="7"]{left:13%;top:50%}
#grid.round-8 .seat[data-seat="8"]{left:24%;top:24%}
#grid.round-8 .seat .avatar,#grid.round-8.compact-grid .seat .avatar{width:52%;height:auto;aspect-ratio:1;max-height:58%;border-radius:50%;font-size:clamp(13px,4vw,19px);flex-shrink:0}
#grid.round-8 .seat .name,#grid.round-8.compact-grid .seat .name{position:static;max-width:100%;padding:0 2px;font-size:clamp(9px,2.55vw,11px);line-height:1.12;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;background:transparent}
#grid.round-8 .seat .role,#grid.round-8 .seat .mod{display:none}
#grid.round-8 .seat .badge{top:6px;bottom:auto;right:6px;width:9px;height:9px;padding:0;font-size:0;background:#b65869;border-radius:50%}
#grid.round-8 .seat.micOn .badge{background:#43e1a4}
#grid.round-8 .seat.speaking{border-color:var(--live-speaker-glow,#c18aff)!important;box-shadow:0 0 0 2px var(--live-speaker-glow,#c18aff),0 0 18px var(--live-speaker-glow,#c18aff)!important;z-index:2}

<script>
const S=window.MW;const IS_VIDEO=S.roomMode==='video';document.body.classList.toggle('video-room',IS_VIDEO);
document.getElementById('title').textContent=S.roomTitle||'LIVE';document.getElementById('accessLabel').textContent=S.roomAccess==='closed'?'🔒 Закрытый':'Открытый';
setInterval(()=>{const sec=Math.max(0,Math.floor((Date.now()-roomOpenedAt)/1000)),h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor((sec%3600)/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');const t=document.getElementById('liveTimer');if(t)t.textContent=h+':'+m+':'+ss;},1000);
const pending={};
let stateData=null,lastSignal=0,closed=false,stateTimer=null,signalTimer=null,messageTimer=null,bookTimer=null,localStream=null,lastMessage=0;
let stateBusy=false,signalBusy=false,messageBusy=false,bookBusy=false,lastRenderKey='',lastPeerKey='';
let bookState={active:false},lastBookKey='',localBookPage=0,followBook=true,lastBookImageKey='';
const pcs={},iceQueue={},levelNodes={},remoteStreams={};
let audioCtx=null,levelLoop=false,lastLevelFrame=0;
let micStream=null,mixDest=null,recordDest=null,micSource=null,micGainNode=null,micBus=null,outGain=null,previewGain=null,localInit=null;
let eqLow=null,eqMid=null,eqHigh=null,voiceHP=null,voiceLP=null,micComp=null,fxDry=null,fxDelay=null,fxFeedback=null,fxWet=null,fxReverb=null,fxReverbWet=null;
let musicAudio=document.getElementById('musicAudio'),musicSource=null,musicGainNode=null,musicMonitor=null,musicName='Музыка не выбрана';
let sfxBus=null,sfxMonitor=null,currentEq='none',currentFx='original',currentVoice='normal',fxEnabled=true,micVolume=1,previewMic=false;
let roomRecorder=null,recordingSession='',recordChunkQueue=Promise.resolve(),recordStartedAt=0,recordStopResolve=null,roomOpenedAt=Date.now(),cameraOn=IS_VIDEO,speakerOn=true;
let audioActivated=false,playbackBlocked=false,rtcProblem='',lastRtcProblemAt=0;
let selectedBackgroundPath='',lastBackgroundMessage=0;
window.mwBackgroundPublished=(path,kind)=>{if(!closed)loadLiveBackground(path,kind);};
window.mwBackgroundReady=(url,kind,path)=>{
  if(closed||selectedBackgroundPath!==path)return;
  const img=document.getElementById('liveBackgroundImage'),video=document.getElementById('liveBackgroundVideo');
  img.classList.add('hidden');video.classList.add('hidden');video.pause();video.removeAttribute('src');video.load();
  if(kind==='image'){img.src=url;img.classList.remove('hidden');}
  else{video.src=url;video.classList.remove('hidden');video.play().catch(()=>banner('Нажмите на экран эфира для запуска видеофона'));}
};
function loadLiveBackground(path,kind){
  if(!path||!['image','video'].includes(kind)||!path.startsWith(S.roomId+'/background/'))return;
  if(path===selectedBackgroundPath)return;
  selectedBackgroundPath=path;
  try{MuwahidNative.cacheBackground(path,kind);}catch(e){banner('Ошибка загрузки фона');}
}
function applyBackgroundMessage(m){
  if(m?.media?.live_background!==true||!stateData||m.sender_id!==stateData.created_by)return;
  if(Number(m.id)<=lastBackgroundMessage)return;
  lastBackgroundMessage=Number(m.id);
  loadLiveBackground(m.media.path,m.kind);
}
function reportRtcProblem(message){rtcProblem=message;lastRtcProblemAt=Date.now();console.warn('Muwahid LIVE WebRTC:',message);updateAudioHealth();}
function lockedAudioHealth(){return !audioActivated||audioCtx?.state!=='running'||playbackBlocked;}
function updateAudioHealth(){
  const box=document.getElementById('audioHelp'),label=document.getElementById('voiceHealth'),btn=document.getElementById('audioActivateBtn');
  if(!box||!label||!btn)return;
  box.classList.toggle('hidden',!stateData||stateData.waiting||(!lockedAudioHealth()&&!rtcProblem));
  if(!stateData||stateData.waiting)return;
  const others=(stateData.members||[]).filter(m=>m.id!==stateData.self_id),connected=others.filter(m=>pcs[m.id]?.connectionState==='connected').length;
  const me=(stateData.members||[]).find(m=>m.id===stateData.self_id);
  const locked=!audioActivated||audioCtx?.state!=='running'||playbackBlocked;
  btn.classList.toggle('hidden',!locked);
  if(locked){label.textContent='Звук не активирован. Нажмите «Включить звук», затем «Микрофон», чтобы говорить.';}
  else if(others.length&&connected===0){label.textContent=rtcProblem&&Date.now()-lastRtcProblemAt<30000?'Звук: '+rtcProblem:'Соединяем звук между участниками… Если нет связи, попробуйте Wi-Fi вместо мобильного интернета.';}
  else if(!me?.mic_enabled){label.textContent=others.length?`Звук включён · слышно ${connected} из ${others.length} · ваш микрофон выключен`:'Звук включён · нажмите «Микрофон», чтобы говорить';}
  else{label.textContent=others.length?`Микрофон включён · аудиосвязь ${connected} из ${others.length}`:'Микрофон включён · ждём участников';}
}
async function activateAudio(){
  // Explicit click is required by WebView's Web Audio / HTMLMediaElement autoplay policies.
  audioActivated=true;
  try{
    const ctx=getAudioContext();if(!ctx)throw new Error('Аудиодвижок недоступен');
    const resume=ctx.state==='running'?Promise.resolve():ctx.resume();
    // Start each playback on the same user gesture. Never wait for remote tracks
    // to produce audio: play() can remain pending until the peer actually connects.
    playbackBlocked=false;
    for(const a of document.querySelectorAll('#remoteAudios audio')){
      a.play().catch(()=>{playbackBlocked=true;reportRtcProblem('Воспроизведение заблокировано. Нажмите «Включить звук».');});
    }
    await resume;
    if(ctx.state!=='running')throw new Error('Звук заблокирован Android WebView. Нажмите «Включить звук» ещё раз.');
    rtcProblem='';
  }catch(e){audioActivated=false;reportRtcProblem(e.message||'Не удалось запустить звук');banner(e.message||'Не удалось запустить звук');}
  updateAudioHealth();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateAudioHealth();});

window.mwResult=(id,json,err)=>{const p=pending[id];if(!p)return;delete pending[id];clearTimeout(p.timer);try{err?p.reject(new Error(err)):p.resolve(json===null?null:JSON.parse(json));}catch(e){p.reject(e);}};
function rpc(fn,args={}){
  return new Promise((resolve,reject)=>{
    const id=Math.random().toString(36).slice(2)+Date.now();
    // Never leave an ongoing LIVE action indefinitely blocked by a lost callback.
    const timer=setTimeout(()=>{delete pending[id];reject(new Error('Сервер LIVE не отвечает. Повторите попытку.'));},15000);
    pending[id]={resolve,reject,timer};
    try{MuwahidNative.rpc(id,fn,JSON.stringify(args));}
    catch(e){clearTimeout(timer);delete pending[id];reject(e);}
  });
}
function banner(t){document.getElementById('banner').textContent=t||'';}
function roleName(r){return r==='owner'?'Владелец':r==='host'?'Ведущий':r==='moderator'?'Модератор':r==='waiting'?'Ожидание':'Участник';}
function initials(n){return (n||'M').trim().slice(0,1).toUpperCase()||'M';}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scheduleState(delay=900){clearTimeout(stateTimer);if(closed)return;stateTimer=setTimeout(async()=>{await refreshState();scheduleState(900);},delay);}
function signalDelay(){if(closed||!stateData||stateData.waiting)return 500;const ids=(stateData.members||[]).map(x=>x.id).filter(x=>x!==stateData.self_id);if(!ids.length)return 500;let ready=0;for(const id of ids){const pc=pcs[id];if(pc&&(pc.connectionState==='connected'||pc.iceConnectionState==='connected'||pc.iceConnectionState==='completed'))ready++;}return ready===ids.length?600:90;}
function scheduleSignals(delay=60){clearTimeout(signalTimer);if(closed)return;signalTimer=setTimeout(async()=>{await pollSignals();scheduleSignals(signalDelay());},delay);}
function scheduleMessages(delay=1800){clearTimeout(messageTimer);if(closed)return;messageTimer=setTimeout(async()=>{await pollMessages();scheduleMessages(1800);},delay);}
function scheduleBook(delay=900){clearTimeout(bookTimer);if(closed)return;bookTimer=setTimeout(async()=>{await refreshBookState();scheduleBook(bookState?.active?650:1800);},delay);}

async function start(){
  let didJoin=false;
  try{MuwahidNative.setSpeaker(true);
    const joined=await rpc('mw_room_join',{p_room:S.roomId});didJoin=true;
    await refreshState(true);
    await refreshLiveConfig();
    await syncRoomTheme();
    if(!roomThemeSyncTimer)roomThemeSyncTimer=setInterval(syncRoomTheme,roomThemePollMs);
    if(!liveConfigTimer)liveConfigTimer=setInterval(refreshLiveConfig,45000);
    if(joined){await pollMessages();await refreshBookState(true);
      // The server RPC restores the last chosen background even after >50 chat messages.
      try{const bg=await rpc('mw_room_background_get',{p_room:S.roomId});
        if(bg?.path&&Number(bg.id)>lastBackgroundMessage){lastBackgroundMessage=Number(bg.id);loadLiveBackground(bg.path,bg.kind);}
      }catch(e){/* Compatible with servers awaiting the optional background RPC deployment. */}
    }
    scheduleState(900);scheduleSignals(40);scheduleMessages(1800);scheduleBook(800);
  }catch(e){
    banner(e.message||'Не удалось войти в комнату');
    if((e.message||'').includes('закрыт')||(e.message||'').includes('не существует')){
      alert('Эфир завершён. Эта ссылка больше не действует.');
    }
    if(didJoin)await Promise.race([rpc('mw_room_leave',{p_room:S.roomId}).catch(()=>{}),new Promise(r=>setTimeout(r,2200))]);
    setTimeout(()=>MuwahidNative.close(),350);
  }
}

async function refreshState(force=false){
  if(closed||stateBusy)return;stateBusy=true;
  try{
    const d=await rpc('mw_room_state',{p_room:S.roomId});const wasWaiting=!!stateData?.waiting;stateData=d;
    const renderKey=JSON.stringify(d);if(force||renderKey!==lastRenderKey){lastRenderKey=renderKey;render();}
    if(!d.waiting){
      await ensureLocal();const ids=(d.members||[]).map(x=>x.id).filter(x=>x!==d.self_id).sort();const peerKey=ids.join(',');
      if(peerKey!==lastPeerKey||ids.some(id=>!pcs[id]||((pcs[id].connectionState==='connecting'||pcs[id].connectionState==='new')&&Date.now()-pcs[id]._createdAt>25000))){
        ids.forEach(id=>{const pc=pcs[id];if(pc&&Date.now()-pc._createdAt>25000&&pc.connectionState!=='connected')closePeer(id);});
        lastPeerKey=peerKey;await syncPeers();
      }
      syncOwnTrack();if(wasWaiting){await pollMessages();await refreshBookState(true);}
    }else{lastPeerKey='';closeAll();}
  }catch(e){banner(e.message||'Связь с комнатой потеряна');if((e.message||'').includes('больше не участник')||(e.message||'').includes('закрыта'))setTimeout(()=>leaveRoom(false),900);}
  finally{stateBusy=false;}
}

function memberList(){return (stateData?.visible_members&&stateData.visible_members.length?stateData.visible_members:stateData?.members)||[];}
function render(){
  const d=stateData;if(!d)return;document.getElementById('title').textContent=d.title;
  const visible=memberList(),participantCount=Number(d.participant_count??visible.length??0);
  const exitButton=document.getElementById('exitRoomBtn');
  if(exitButton)exitButton.textContent=d.created_by===d.self_id?'Завершить эфир':'Выйти из эфира';
  const roomCapacity=Math.max(4,Number(d.capacity||S.roomCapacity||8));
  document.getElementById('participantsBtn').textContent=participantCount+'/'+roomCapacity;
  document.getElementById('accessLabel').textContent=(d.access_mode||S.roomAccess)==='closed'?'🔒 Закрытый':'Открытый';
  const waiting=!!d.waiting;document.getElementById('waitingHero').classList.toggle('hidden',!waiting);document.getElementById('roomContent').classList.toggle('hidden',waiting);document.getElementById('controls').classList.toggle('hidden',waiting);
  if(waiting){
    document.getElementById('waitingNumber').textContent=d.waiting_position||1;
    document.getElementById('count').textContent=participantCount+' в комнате · ваше место в очереди '+(d.waiting_position||1);
    banner('Вы в зале ожидания. Модератор увидит запрос и сможет поднять вас.');return;
  }
  const members=d.members||[],listeners=members.filter(m=>m.seat==null);
  const capacity=Number(d.capacity||S.roomCapacity||8),seatCount=Math.max(4,Math.min(12,capacity));
  document.getElementById('count').textContent=members.length+' участников · '+seatCount+' мест';
  // Every selected seat is visible; the former limit of five tiles hid valid speakers.
  const bySeat=new Map(members.filter(m=>Number.isInteger(Number(m.seat))&&Number(m.seat)>=1).map(m=>[Number(m.seat),m]));
  const stage=document.getElementById('grid');stage.style.gridTemplateColumns='repeat(2,minmax(0,1fr))';
  stage.classList.toggle('compact-grid',seatCount>=6);
  stage.classList.toggle('round-8',!IS_VIDEO&&seatCount===8&&liveSeatLayout==='circle_8');
  let html='';
  for(let position=1;position<=seatCount;position++){
    const m=bySeat.get(position);
    if(!m){html+=`<div class="seat empty" data-seat="${position}"><div class="avatar">${position}</div><div class="name">Свободное место</div></div>`;continue;}

    const micOn=!!m.mic_enabled&&!!m.mic_allowed,hand=!!m.hand_raised,blocked=!m.mic_allowed,clickable=d.can_moderate&&m.id!==d.self_id;
    html+=`<div class="seat ${micOn?'micOn':''} ${hand?'hand':''} ${blocked?'blocked':''}" data-seat="${position}" data-user-id="${m.id}" ${clickable?`onclick="openMod('${m.id}')"`:''}>${IS_VIDEO?`<video id="video_${m.id}" autoplay playsinline ${m.id===d.self_id?'muted':''}></video>`:''}${clickable?'<div class="mod">⋯</div>':''}<div class="badge">${blocked?'×':micOn?'🎙':'🎤'}</div><div class="avatar">${escapeHtml(initials(m.display_name))}</div><div class="name">${escapeHtml(m.display_name)}</div><div class="role ${['owner','host'].includes(m.role)?'hostRole':''}">${['owner','host'].includes(m.role)?'♛ '+roleName(m.role):roleName(m.role)}</div></div>`;
  }

  if(stage.classList.contains('round-8')&&liveCentralMicEnabled){
    html+=`<button type="button" class="centralMic" id="centralMicBtn" aria-label="Микрофон: включить или выключить" onclick="micAction()"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg><span class="micText">МИКРОФОН</span><span id="micSpeaker" class="micSpeaker">В эфире</span></button>`;
  }
  document.getElementById('grid').innerHTML=html;bindVideoTiles();

function applyEq(){if(!eqLow||!audioCtx)return;const p={none:[0,0,0],pop:[2,1,3],electronic:[4,-1,5],rock:[4,2,4],bass:[8,-1,-2],jazz:[3,2,3]}[currentEq]||[0,0,0];eqLow.gain.setTargetAtTime(p[0],audioCtx.currentTime,.03);eqMid.gain.setTargetAtTime(p[1],audioCtx.currentTime,.03);eqHigh.gain.setTargetAtTime(p[2],audioCtx.currentTime,.03);}
function applyVoice(){if(!voiceHP||!voiceLP||!audioCtx)return;let hp=70,lp=18000,q=.7;if(currentVoice==='soft'){hp=90;lp=6500;q=.55;}else if(currentVoice==='deep'){hp=45;lp=9000;q=.8;}else if(currentVoice==='bright'){hp=170;lp=18000;q=.65;}else if(currentVoice==='radio'){hp=420;lp=3400;q=1.15;}else if(currentVoice==='robot'){hp=650;lp=5200;q=3.2;}voiceHP.frequency.setTargetAtTime(hp,audioCtx.currentTime,.03);voiceHP.Q.setTargetAtTime(q,audioCtx.currentTime,.03);voiceLP.frequency.setTargetAtTime(lp,audioCtx.currentTime,.03);voiceLP.Q.setTargetAtTime(q,audioCtx.currentTime,.03);}
function applyRoomFx(){if(!fxDry||!audioCtx)return;let dry=1,wet=0,rev=0,delay=.16,fb=.18;if(fxEnabled){if(currentFx==='echo'){dry=.92;wet=.34;delay=.22;fb=.30;}else if(currentFx==='concert'){dry=.92;wet=.18;rev=.30;delay=.12;fb=.16;}else if(currentFx==='karaoke'){dry=1;wet=.12;rev=.12;delay=.085;fb=.08;}else if(currentFx==='broadcast'){dry=1;wet=.04;rev=.04;delay=.045;fb=.03;}else if(currentFx==='hall'){dry=.85;wet=.20;rev=.42;delay=.18;fb=.20;}}fxDry.gain.setTargetAtTime(dry,audioCtx.currentTime,.03);fxWet.gain.setTargetAtTime(wet,audioCtx.currentTime,.03);fxReverbWet.gain.setTargetAtTime(rev,audioCtx.currentTime,.03);fxDelay.delayTime.setTargetAtTime(delay,audioCtx.currentTime,.03);fxFeedback.gain.setTargetAtTime(fb,audioCtx.currentTime,.03);}
function makeImpulse(ctx,seconds=1.8,decay=2.4){const len=Math.max(1,Math.floor(ctx.sampleRate*seconds)),b=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}return b;}

async function sendSignal(to,kind,payload){try{return await rpc('mw_room_signal_send',{p_room:S.roomId,p_to:to,p_kind:kind,p_payload:payload||{}});}catch(e){reportRtcProblem('Сигнал '+kind+' не отправлен: '+(e.message||'ошибка сервера'));throw e;}}
async function pollSignals(){if(closed||signalBusy||!stateData||stateData.waiting)return;signalBusy=true;try{const arr=await rpc('mw_room_signal_poll',{p_room:S.roomId,p_after:lastSignal});for(const s of(arr||[])){lastSignal=Math.max(lastSignal,Number(s.id)||0);await handleSignal(s);}}catch(e){reportRtcProblem('Не удалось получить сигнал: '+(e.message||'ошибка сервера'));}finally{signalBusy=false;}}
async function handleSignal(s){const peer=s.from_user,p=s.payload||{};try{if(s.kind==='offer'){let pc=pcs[peer];if(!pc)pc=await createPeer(peer,false);if(pc.signalingState!=='stable'&&pc.localDescription?.type==='offer'){if(String(stateData.self_id).localeCompare(String(peer))<0)return;await pc.setLocalDescription({type:'rollback'});}await pc.setRemoteDescription({type:'offer',sdp:p.sdp});await flushIce(peer,pc);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await sendSignal(peer,'answer',{sdp:ans.sdp});}else if(s.kind==='answer'){const pc=pcs[peer];if(pc&&pc.signalingState==='have-local-offer'){await pc.setRemoteDescription({type:'answer',sdp:p.sdp});await flushIce(peer,pc);}}else if(s.kind==='ice'){const cs=Array.isArray(p.candidates)?p.candidates:(p.candidate?[p.candidate]:[]);if(!cs.length)return;const pc=pcs[peer];for(const c of cs){if(pc&&pc.remoteDescription){await pc.addIceCandidate(c);}else{(iceQueue[peer]||(iceQueue[peer]=[])).push(c);}}}else if(s.kind==='bye')closePeer(peer);}catch(e){reportRtcProblem('Сбой согласования WebRTC: '+(e.message||'ошибка'));}}
async function flushIce(peer,pc){for(const c of(iceQueue[peer]||[])){try{await pc.addIceCandidate(c);}catch(e){}}iceQueue[peer]=[];}
function closePeer(id){const pc=pcs[id];if(pc){if(pc._iceTimer)clearTimeout(pc._iceTimer);pc._iceTimer=null;pc._iceBatch=[];try{pc.close();}catch(e){}delete pcs[id];}detachLevel(id);delete remoteStreams[id];delete iceQueue[id];const a=document.getElementById('audio_'+id);if(a){try{a.srcObject=null;}catch(e){}a.remove();}if(!closed)updateAudioHealth();}
function closeAll(){Object.keys(pcs).forEach(closePeer);}

async function refreshBookState(force=false){
  if(closed||bookBusy||!stateData||stateData.waiting)return;bookBusy=true;
  try{const b=await rpc('mw_room_book_state',{p_room:S.roomId});const key=JSON.stringify(b||{active:false});if(force||key!==lastBookKey){const oldPath=bookState?.path;bookState=b||{active:false};lastBookKey=key;if(bookState.active&&(followBook||bookState.controller_id===stateData.self_id||oldPath!==bookState.path))localBookPage=Number(bookState.page)||0;renderBook(true);}}
  catch(e){}finally{bookBusy=false;}
}
function renderBook(forceImage=false){
  if(!stateData||stateData.waiting)return;
  const canOpen=!!stateData.can_moderate,active=!!bookState?.active,me=stateData.self_id,isController=active&&bookState.controller_id===me;
  document.getElementById('openBookBtn').classList.toggle('hidden',!canOpen||active);
  document.getElementById('bookEmpty').classList.toggle('hidden',active);document.getElementById('bookViewer').classList.toggle('hidden',!active);
  if(!active){lastBookImageKey='';return;}
  document.getElementById('bookName').textContent=bookState.file_name||'Книга';document.getElementById('bookController').textContent='Управляет: '+(bookState.controller_name||'участник');
  const total=Math.max(1,Number(bookState.total_pages)||1);localBookPage=Math.max(0,Math.min(total-1,Number(localBookPage)||0));
  document.getElementById('bookPageInfo').textContent=(localBookPage+1)+' / '+total;
  document.getElementById('followRow').classList.toggle('hidden',isController);document.getElementById('followBook').checked=followBook;
  const allowLocalNav=isController||!followBook;document.getElementById('bookPrev').disabled=!allowLocalNav||localBookPage<=0;document.getElementById('bookNext').disabled=!allowLocalNav||localBookPage>=total-1;
  document.getElementById('transferBookBtn').classList.toggle('hidden',!stateData.can_moderate);document.getElementById('stopBookBtn').classList.toggle('hidden',!(stateData.can_moderate||isController));
  renderBookImage(forceImage);
}
function renderBookImage(force=false){
  if(!bookState?.active)return;const key=(bookState.path||'')+'|'+localBookPage+'|'+(bookState.updated_at||'');if(!force&&key===lastBookImageKey)return;lastBookImageKey=key;
  const img=document.getElementById('bookImage'),loading=document.getElementById('bookLoading');img.classList.add('hidden');loading.classList.remove('hidden');loading.textContent='Загружаем страницу…';
  img.onload=()=>{loading.classList.add('hidden');img.classList.remove('hidden');};img.onerror=()=>{loading.textContent='Не удалось показать страницу';img.classList.add('hidden');};
  img.src='https://muwahid.local/book-page?path='+encodeURIComponent(bookState.path)+'&page='+encodeURIComponent(localBookPage)+'&v='+Date.now();
}
async function changeBookPage(delta){
  if(!bookState?.active)return;const total=Number(bookState.total_pages)||1,next=Math.max(0,Math.min(total-1,localBookPage+delta));if(next===localBookPage)return;
  const isController=bookState.controller_id===stateData?.self_id;if(isController){localBookPage=next;renderBook(true);try{await rpc('mw_room_book_page',{p_room:S.roomId,p_page:next});bookState.page=next;}catch(e){banner(e.message);await refreshBookState(true);}}
  else if(!followBook){localBookPage=next;renderBook(true);}
}
function toggleFollowBook(){followBook=!!document.getElementById('followBook').checked;if(followBook&&bookState?.active){localBookPage=Number(bookState.page)||0;renderBook(true);}}
function openBookControlSheet(){
  if(!stateData?.can_moderate||!bookState?.active)return;const arr=stateData.members||[];document.getElementById('sheetTitle').textContent='Передать управление книгой';let html='';
  for(const m of arr)html+=`<button onclick="giveBookControl('${m.id}')">${escapeHtml(m.display_name)}${m.id===bookState.controller_id?' · сейчас управляет':''}</button>`;
  html+='<button class="cancel" onclick="closeSheet()">Отмена</button>';document.getElementById('sheetBtns').innerHTML=html;document.getElementById('sheetWrap').style.display='flex';
}
async function giveBookControl(uid){closeSheet();try{await rpc('mw_room_book_controller',{p_room:S.roomId,p_user:uid});await refreshBookState(true);}catch(e){banner(e.message);}}
async function stopBook(){try{await rpc('mw_room_book_stop',{p_room:S.roomId});bookState={active:false};lastBookKey='';renderBook(true);}catch(e){banner(e.message);}}
window.mwBookStarted=(b)=>{bookState=b||{active:false};bookState.active=true;localBookPage=Number(bookState.page)||0;followBook=true;lastBookKey=JSON.stringify(bookState);renderBook(true);};

async function pollMessages(){if(closed||messageBusy||!stateData||stateData.waiting)return;messageBusy=true;try{const arr=await rpc('mw_room_messages_get',{p_room:S.roomId,p_after:lastMessage});if((arr||[]).length){for(const m of arr){lastMessage=Math.max(lastMessage,Number(m.id)||0);applyBackgroundMessage(m);appendMessage(m);}const box=document.getElementById('chatMessages');box.scrollTop=box.scrollHeight;}}catch(e){}finally{messageBusy=false;}}
function appendMessage(m){if(m?.media?.live_background===true)return;if(document.getElementById('msg_'+m.id))return;const box=document.getElementById('chatMessages'),mine=m.sender_id===stateData?.self_id,d=document.createElement('div');d.className='msg '+(mine?'mine':'');d.id='msg_'+m.id;let body=`<div class="sender">${escapeHtml(m.sender_name||'Участник')}</div>`;if(m.kind==='text')body+=`<div>${escapeHtml(m.body||'')}</div>`;else{const media=m.media||{},enc=encodeURIComponent(media.path||''),mime=encodeURIComponent(media.mime||'application/octet-stream'),name=encodeURIComponent(media.name||m.kind);body+=`<div class="mediaMsg" onclick="openRoomMedia('${enc}','${mime}','${name}')">${m.kind==='image'?'📷 Фото':m.kind==='video'?'🎬 Видео':'📎 Файл'} · открыть</div>`;}d.innerHTML=body;box.appendChild(d);}
async function sendChat(){if(!stateData||stateData.waiting)return;const input=document.getElementById('chatInput'),body=input.value.trim();if(!body)return;input.value='';try{const m=await rpc('mw_room_message_send',{p_room:S.roomId,p_kind:'text',p_body:body,p_media:null});lastMessage=Math.max(lastMessage,Number(m.id)||0);appendMessage(m);const box=document.getElementById('chatMessages');box.scrollTop=box.scrollHeight;}catch(e){input.value=body;banner(e.message);}}
function openRoomMedia(path,mime,name){MuwahidNative.openMedia(decodeURIComponent(path),decodeURIComponent(mime),decodeURIComponent(name));}
window.mwRoomMediaSent=()=>pollMessages();
window.leaveRoom=async function(callServer=true){
  if(closed)return;closed=true;
  clearTimeout(stateTimer);clearTimeout(signalTimer);clearTimeout(messageTimer);clearTimeout(bookTimer);
  if(roomThemeSyncTimer){clearInterval(roomThemeSyncTimer);roomThemeSyncTimer=null;}
  if(liveConfigTimer){clearInterval(liveConfigTimer);liveConfigTimer=null;}
  // Mute immediately, even when the server is slow or the device is offline.
  if(micStream)micStream.getTracks().forEach(t=>{t.enabled=false;try{t.stop();}catch(e){}});
  if(localStream)localStream.getTracks().forEach(t=>{t.enabled=false;try{t.stop();}catch(e){}});
  try{if(roomRecorder&&roomRecorder.state!=='inactive')await Promise.race([stopRoomRecording(),new Promise(r=>setTimeout(r,2200))]);}catch(e){}
  try{musicAudio.pause();musicAudio.src='';}catch(e){}
  try{document.getElementById('liveBackgroundVideo').pause();}catch(e){}
  try{if(callServer){
    // Always attempt the server exit even if disabling the microphone fails.
    await Promise.race([rpc('mw_room_leave',{p_room:S.roomId}),new Promise(r=>setTimeout(r,3500))]);
  }}catch(e){}
  closeAll();detachLevel(stateData?.self_id||S.selfId);
  micStream=null;localStream=null;
  try{await Promise.race([audioCtx?.close()||Promise.resolve(),new Promise(r=>setTimeout(r,1000))]);}catch(e){}
  MuwahidNative.setSpeaker(false);MuwahidNative.close();
};
start();
