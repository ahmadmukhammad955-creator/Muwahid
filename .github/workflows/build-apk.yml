name: Build Muwahid APK 0.13.32

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish signed APK after verified device checks (main only)'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: muwahid-live-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_ZIP: Muwahid_0.13.32_LIVE_TWO_STAGE.zip
      BUNDLE_ZIP: Muwahid_0.13.32_LIVE_TWO_STAGE.zip
      EXPECTED_VERSION_NAME: '0.13.32'
      EXPECTED_VERSION_CODE: '67'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # Gradle 8.7 installation with retries and a second distribution mirror.
      # Avoid a transient setup-gradle HTTP 504 failing the job before compilation.
      - name: Install Gradle 8.7 with retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gradle-dist"
          DIST="$RUNNER_TEMP/gradle-dist/gradle-8.7-bin.zip"
          ok=false
          for url in \
            'https://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'https://downloads.gradle.org/distributions/gradle-8.7-bin.zip'; do
            if curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
                --connect-timeout 20 --max-time 240 --output "$DIST" "$url" \
                && unzip -tq "$DIST" >/dev/null; then
              ok=true
              break
            fi
            rm -f "$DIST"
          done
          test "$ok" = true || { echo 'Gradle 8.7 download failed on both mirrors'; exit 1; }
          unzip -q "$DIST" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-dist/gradle-8.7/bin/gradle" --version

      - name: Extract and verify Muwahid 0.13.32
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BUNDLE_ZIP"
          rm -rf Muwahid
          unzip -q "$BUNDLE_ZIP"
          test -f Muwahid/app/build.gradle
          VERSION_NAME="$(sed -n "s/.*versionName '[^']*'.*/\1/p" Muwahid/app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode [0-9][0-9]*.*/\1/p' Muwahid/app/build.gradle | head -1)"
          test "$VERSION_NAME" = 
