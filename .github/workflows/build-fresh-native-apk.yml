name: Build Muwahid Fresh Native APK
on:
  push:
    branches: [muwahid-fresh-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack entirely new native source
        run: unzip -q Muwahid_FreshNative_Project.zip -d fresh
      - name: Check Maven mirror accessibility
        run: |
          curl -IL --max-time 15 -sS -o /dev/null -w "MAVEN_CENTRAL_HTTP=%{http_code}\n" https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom
          curl -IL --max-time 15 -sS -o /dev/null -w "MAVEN_REPO1_HTTP=%{http_code}\n" https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom
          curl -IL --max-time 15 -sS -o /dev/null -w "MAVEN_GOOGLE_HTTP=%{http_code}\n" https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.7.3/gradle-8.7.3.pom
      - name: Compile Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd fresh
          gradle --no-daemon --refresh-dependencies --stacktrace assembleDebug
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Muwahid-Fresh-Native-APK
          path: fresh/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 15
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 480
          script: |
            adb install -r fresh/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.muwahid.fresh/.MainActivity
            sleep 7
            adb shell dumpsys activity activities > activities.log
            grep -q 'com.muwahid.fresh/.MainActivity' activities.log
            adb logcat -d -s AndroidRuntime:E > crashes.log
            if grep -q 'FATAL EXCEPTION' crashes.log; then cat crashes.log; exit 1; fi
            adb shell screencap -p /sdcard/muwahid-smoke.png
            adb pull /sdcard/muwahid-smoke.png muwahid-smoke.png
      - name: Save Android emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Muwahid-Fresh-Launch-QA
          path: |
            muwahid-smoke.png
            activities.log
            crashes.log
          if-no-files-found: ignore
          retention-days: 15
