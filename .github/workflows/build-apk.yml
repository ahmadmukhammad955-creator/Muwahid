name: Build Muwahid APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract project
        run: unzip -q Muwahid_Android_GitHub_APK.zip
      - name: Build APK and device checks
        run: cd Muwahid && gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Muwahid-APK
          path: Muwahid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check notes and navigation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install Muwahid/app/build/outputs/apk/debug/app-debug.apk
            adb install Muwahid/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.muwahid.app.test/com.muwahid.app.SmokeInstrumentation | tee smoke-result.txt
            grep 'MW_SMOKE_OK' smoke-result.txt
            adb pull /sdcard/Android/data/com.muwahid.app/files/ screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Muwahid-device-check
          path: |
            screenshots/
            smoke-result.txt
