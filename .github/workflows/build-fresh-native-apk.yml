name: Build Muwahid Fresh Native APK
on:
  push:
    branches: [muwahid-fresh-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack entirely new native source
        run: unzip -q Muwahid_FreshNative_Project.zip -d fresh
      - name: Compile Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd fresh
          gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Muwahid-Fresh-Native-APK
          path: fresh/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 15
