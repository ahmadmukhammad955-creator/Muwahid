name: Build Muwahid APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract project
        run: |
          unzip -q Muwahid_0.12.8_PROFILE_PROJECT.zip
          grep -Fq "versionCode 32" Muwahid/app/build.gradle
          grep -Fq "versionName '0.12.8'" Muwahid/app/build.gradle
          # Align stale test expectations with the verified version and Profile tab.
          sed -i 's/0[.]12[.]7/0.12.8/g; s/"Звонки"/"Профиль"/g; s/Missing calls navigation/Missing profile navigation/g' Muwahid/app/src/androidTest/java/com/muwahid/app/SmokeInstrumentation.java
          cd Muwahid
          bash VERIFY_PROJECT.sh
          echo "Building Muwahid 0.12.8 (32) from profile project"
      - name: Prepare stable signing
        env:
          MUWAHID_KEYSTORE_B64: ${{ secrets.MUWAHID_KEYSTORE_B64 }}
          MUWAHID_KEYSTORE_PASSWORD: ${{ secrets.MUWAHID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$MUWAHID_KEYSTORE_B64" ] && [ -n "$MUWAHID_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$MUWAHID_KEYSTORE_B64" | base64 --decode > Muwahid/muwahid-release.jks
            keytool -list -keystore Muwahid/muwahid-release.jks -storepass "$MUWAHID_KEYSTORE_PASSWORD" -alias muwahid >/dev/null
            echo "MUWAHID_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "MUWAHID_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "Stable signing secrets are not configured; no installable release update will be published."
          fi
      - name: Build device-test APK
        env:
          MUWAHID_KEYSTORE_PASSWORD: ${{ secrets.MUWAHID_KEYSTORE_PASSWORD }}
        run: cd Muwahid && gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Build signed release APK
        if: ${{ env.MUWAHID_STABLE_SIGNING == 'true' }}
        env:
          MUWAHID_KEYSTORE_PASSWORD: ${{ secrets.MUWAHID_KEYSTORE_PASSWORD }}
        run: cd Muwahid && gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ env.MUWAHID_STABLE_SIGNING == 'true' }}
        with:
          name: Muwahid-APK
          path: Muwahid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ env.MUWAHID_STABLE_SIGNING != 'true' }}
        with:
          name: Muwahid-TEST-APK-NOT-FOR-UPDATE
          path: Muwahid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check notes and navigation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install Muwahid/app/build/outputs/apk/debug/app-debug.apk
            adb install Muwahid/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.muwahid.app.test/com.muwahid.app.SmokeInstrumentation | tee smoke-result.txt
            grep 'MW_SMOKE_OK' smoke-result.txt
            adb pull /sdcard/Android/data/com.muwahid.app/files/ screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Muwahid-device-check
          path: |
            screenshots/
            smoke-result.txt
      - name: Publish signed in-place update
        if: ${{ success() && env.MUWAHID_STABLE_SIGNING == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" Muwahid/app/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' Muwahid/app/build.gradle | head -1)
          APK="$GITHUB_WORKSPACE/Muwahid/app/build/outputs/apk/release/app-release.apk"
          ASSET="Muwahid-${VERSION_NAME}.apk"
          RELEASE_APK="$GITHUB_WORKSPACE/$ASSET"
          cp "$APK" "$RELEASE_APK"
          SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          TAG="v${VERSION_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Muwahid ${VERSION_NAME}" --notes "Muwahid Android ${VERSION_NAME} — hardened release build"
          gh release upload "$TAG" "$RELEASE_APK" --clobber
          mkdir -p updates
          cat > updates/latest.json <<JSON
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}",
            "sha256": "${SHA256}",
            "notes": "Обновление безопасности Muwahid. Release-сборка, усиленная защита WebView и серверных прав."
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Muwahid ${VERSION_NAME} security update [skip ci]"
            git push
          fi
