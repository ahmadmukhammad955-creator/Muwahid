name: Stage LIVE source for isolated audio repair
on:
  push:
    branches: [fix/live-audio-20261110]
permissions:
  contents: write
jobs:
  stage:
    if: "!contains(github.event.head_commit.message, '[skip stage]')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract existing LIVE source only (no production changes)
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Muwahid_0.13.37_PROFILE_QR.zip -d "$RUNNER_TEMP/source"
          mkdir -p android/live-audio/src
          if [ ! -f android/live-audio/src/voice_room.html ]; then
            cp "$RUNNER_TEMP/source/Muwahid/app/src/main/assets/voice_room.html" android/live-audio/src/voice_room.html
          fi
          if [ ! -f android/live-audio/src/VoiceRoomActivity.java ]; then
            cp "$RUNNER_TEMP/source/Muwahid/app/src/main/java/com/muwahid/app/VoiceRoomActivity.java" android/live-audio/src/VoiceRoomActivity.java
          fi
          git add android/live-audio/src/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: stage editable LIVE Android source [skip stage]"
            git push origin HEAD:fix/live-audio-20261110
          fi
