name: Build Muwahid APK 0.13.38

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish signed APK after verified device checks (main only)'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: muwahid-live-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_ZIP: Muwahid_0.13.37_PROFILE_QR.zip
      BUNDLE_ZIP: Muwahid_0.13.37_PROFILE_QR.zip
      EXPECTED_VERSION_NAME: '0.13.38'
      EXPECTED_VERSION_CODE: '73'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Gradle 8.7 with fallback
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/gradle-8.7-bin.zip"
          ok=false
          for url in \
            "https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-8.7-bin.zip"; do
            rm -f "$DIST"
            if curl -fL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 240 -o "$DIST" "$url" && unzip -tq "$DIST" >/dev/null; then
              ok=true
              break
            fi
          done
          if [ "$ok" != true ]; then
            echo "::error::Gradle 8.7 unavailable from all configured sources"
            exit 1
          fi
          unzip -q "$DIST" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" --version

      - name: Verify baseline and apply family security changes
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BUNDLE_ZIP"
          rm -rf Muwahid
          unzip -q "$BUNDLE_ZIP"
          test -f Muwahid/app/build.gradle
          cd Muwahid
          sha256sum -c PROJECT_CHECKSUMS.sha256
          bash VERIFY_PROJECT.sh
          python3 tests/check_live_01332_two_stage.py
          python3 tests/check_live_01332.py
          python3 tests/check_update_alerts.py
          python3 tests/check_call_push_01333.py
          python3 tests/check_live_chat_toggle_01334.py
          python3 tests/check_live_lobby_01334.py
          python3 tests/check_call_ringback_01335.py
          python3 tests/check_call_ringback_runtime_01335.py
          python3 tests/check_call_camera_runtime.py
          patch --dry-run --batch --forward --fuzz=0 -p1 < "$GITHUB_WORKSPACE/android/family-security.patch"
          patch --batch --forward --fuzz=0 -p1 < "$GITHUB_WORKSPACE/android/family-security.patch"
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          test "$VERSION_NAME" = "$EXPECTED_VERSION_NAME"
          test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE"

      - name: Prepare stable signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MUWAHID_KEYSTORE_B64: ${{ secrets.MUWAHID_KEYSTORE_B64 }}
          MUWAHID_KEYSTORE_PASSWORD: ${{ secrets.MUWAHID_KEYSTORE_PASSWORD }}
          MUWAHID_FCM_APP_ID: ${{ secrets.MUWAHID_FCM_APP_ID }}
          MUWAHID_FCM_API_KEY: ${{ secrets.MUWAHID_FCM_API_KEY }}
          MUWAHID_FCM_SENDER_ID: ${{ secrets.MUWAHID_FCM_SENDER_ID }}
          MUWAHID_FCM_PROJECT_ID: ${{ secrets.MUWAHID_FCM_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MUWAHID_KEYSTORE_B64:-}" ] && [ -n "${MUWAHID_KEYSTORE_PASSWORD:-}" ]; then
            printf '%s' "$MUWAHID_KEYSTORE_B64" | base64 --decode > Muwahid/muwahid-release.jks
            keytool -list -keystore Muwahid/muwahid-release.jks -storepass "$MUWAHID_KEYSTORE_PASSWORD" -alias muwahid >/dev/null
            echo "MUWAHID_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "MUWAHID_STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build debug and Android test APKs
        env:
          MUWAHID_KEYSTORE_PASSWORD: ${{ secrets.MUWAHID_KEYSTORE_PASSWORD }}
          MUWAHID_FCM_APP_ID: ${{ secrets.MUWAHID_FCM_APP_ID }}
          MUWAHID_FCM_API_KEY: ${{ secrets.MUWAHID_FCM_API_KEY }}
          MUWAHID_FCM_SENDER_ID: ${{ secrets.MUWAHID_FCM_SENDER_ID }}
          MUWAHID_FCM_PROJECT_ID: ${{ secrets.MUWAHID_FCM_PROJECT_ID }}
        run: cd Muwahid && gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Build signed release APK
        if: ${{ github.ref == 'refs/heads/main' && env.MUWAHID_STABLE_SIGNING == 'true' }}
        env:
          MUWAHID_KEYSTORE_PASSWORD: ${{ secrets.MUWAHID_KEYSTORE_PASSWORD }}
          MUWAHID_FCM_APP_ID: ${{ secrets.MUWAHID_FCM_APP_ID }}
          MUWAHID_FCM_API_KEY: ${{ secrets.MUWAHID_FCM_API_KEY }}
          MUWAHID_FCM_SENDER_ID: ${{ secrets.MUWAHID_FCM_SENDER_ID }}
          MUWAHID_FCM_PROJECT_ID: ${{ secrets.MUWAHID_FCM_PROJECT_ID }}
        run: cd Muwahid && gradle --no-daemon assembleRelease

      - name: Verify release signing against the public APK
        if: ${{ github.ref == 'refs/heads/main' && env.MUWAHID_STABLE_SIGNING == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/Muwahid-0.13.37.apk"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.13.37/Muwahid-0.13.37.apk" -o "$previous"
          echo "54efec58bcd0cb3e3d9661dc48731513a8d57148adc33b17d48fc15a336792e1  $previous" | sha256sum -c
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            sdkmanager "build-tools;34.0.0"
          fi
          test -x "$apksigner"
          expected_certificate=6dc70bc1686081abfa3f3d17d6fe9ef98e9db125328e6859628723c50ffa2bf5
          for apk in "$previous" Muwahid/app/build/outputs/apk/release/app-release.apk; do
            echo "Checking signature of $apk"
            certificates="$("$apksigner" verify --verbose --print-certs "$apk")"
            printf '%s\n' "$certificates"
            digest="$(printf '%s\n' "$certificates" | awk '/^Signer #[0-9]+ certificate SHA-256 digest:/{print $NF}')"
            if [ "$digest" != "$expected_certificate" ]; then
              echo "::error::The APK is not signed with the certificate used by the public Muwahid release."
              exit 1
            fi
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check Muwahid on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: 'true'
          script: |
            set -eu
            if [ "${MUWAHID_STABLE_SIGNING:-false}" = true ]; then adb install "$RUNNER_TEMP/Muwahid-0.13.37.apk" && adb install -r Muwahid/app/build/outputs/apk/release/app-release.apk && adb shell dumpsys package com.muwahid.app | grep -F "versionCode=${EXPECTED_VERSION_CODE} "; fi
            adb install -r Muwahid/app/build/outputs/apk/debug/app-debug.apk
            adb install -r Muwahid/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.muwahid.app.test/com.muwahid.app.SmokeInstrumentation > smoke-result.txt
            cat smoke-result.txt
            grep -F "MW_SMOKE_OK: ${EXPECTED_VERSION_NAME}" smoke-result.txt
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.muwahid.app/files/. screenshots/ || true
            test -f screenshots/chat_screen.png
            adb logcat -d -s AndroidRuntime:E > crash-log.txt || true
            ! grep -q 'FATAL EXCEPTION' crash-log.txt || { cat crash-log.txt; exit 1; }

      - name: Upload installable debug APK
        if: ${{ always() && env.MUWAHID_STABLE_SIGNING != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Muwahid-0.13.38-debug-apk
          path: Muwahid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload signed APK
        if: ${{ github.ref == 'refs/heads/main' && env.MUWAHID_STABLE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Muwahid-APK-0.13.38
          path: Muwahid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload device verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Muwahid-0.13.38-device-check
          path: |
            screenshots/
            smoke-result.txt
            crash-log.txt
          if-no-files-found: warn

      - name: Publish signed update
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && github.event.head_commit.message == 'Publish signed Muwahid 0.13.38')) && github.ref == 'refs/heads/main' && env.MUWAHID_STABLE_SIGNING == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/Muwahid/app/build/outputs/apk/release/app-release.apk"
          ASSET="Muwahid-${EXPECTED_VERSION_NAME}.apk"
          RELEASE_APK="$GITHUB_WORKSPACE/$ASSET"
          # The family client is only released after the database gate is active.
          CONFIG=Muwahid/app/build.gradle
          SUPABASE_URL="$(sed -nE "s/.*'SERVER_URL', '\"([^\"]+)\"'.*/\1/p" "$CONFIG")"
          PUBLIC_KEY="$(sed -nE "s/.*'PUBLIC_KEY', '\"([^\"]+)\"'.*/\1/p" "$CONFIG")"
          test -n "$SUPABASE_URL" && test -n "$PUBLIC_KEY"
          test "$(curl --fail --silent --show-error --max-time 20 "$SUPABASE_URL/rest/v1/rpc/mw_family_signup_enabled" \
              -H "apikey: $PUBLIC_KEY" -H 'Content-Type: application/json' --data '{}')" = true
          cp "$APK" "$RELEASE_APK"
          SHA256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          TAG="v${EXPECTED_VERSION_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Muwahid ${EXPECTED_VERSION_NAME}" --notes "Muwahid ${EXPECTED_VERSION_NAME}: Family invitations, session revocation, private messaging protection and signed update verification."
          gh release upload "$TAG" "$RELEASE_APK" --clobber
          mkdir -p updates
          jq -n \
            --argjson versionCode "$EXPECTED_VERSION_CODE" \
            --arg versionName "$EXPECTED_VERSION_NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}" \
            --arg sha256 "$SHA256" \
            --arg notes "Семейные приглашения, управление сеансами, защита личной переписки и проверка подписи обновлений." \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,notes:$notes}' > updates/latest.json
          # Keep metadata from THIS APK, but update from the latest remote main.
          cp updates/latest.json "$RUNNER_TEMP/muwahid-latest.json"
          git restore --staged --worktree updates/latest.json || true
          git fetch origin main
          git switch -C muwahid-release-meta origin/main
          cp "$RUNNER_TEMP/muwahid-latest.json" updates/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Muwahid ${EXPECTED_VERSION_NAME} [skip ci]"
            git push origin HEAD:main
          fi
