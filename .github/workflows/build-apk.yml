name: Build Muwahid APK 0.13.19

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      PROJECT_ZIP: Muwahid_0.13.19_PROJECT.zip
      EXPECTED_VERSION_NAME: "0.13.19"
      EXPECTED_VERSION_CODE: "53"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify exact Muwahid 0.13.19
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ZIP" || {
            echo "ERROR: $PROJECT_ZIP not found"
            exit 1
          }

          rm -rf Muwahid
          unzip -q "$PROJECT_ZIP"

          test -f Muwahid/app/build.gradle || {
            echo "ERROR: app/build.gradle not found"
            exit 1
          }

          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" Muwahid/app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' Muwahid/app/build.gradle | head -1)"

          echo "ZIP: $PROJECT_ZIP"
          echo "versionName: $VERSION_NAME"
          echo "versionCode: $VERSION_CODE"

          test "$VERSION_NAME" = "$EXPECTED_VERSION_NAME" || {
            echo "ERROR: expected versionName $EXPECTED_VERSION_NAME, got $VERSION_NAME"
            exit 1
          }

          test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE" || {
            echo "ERROR: expected versionCode $EXPECTED_VERSION_CODE, got $VERSION_CODE"
            exit 1
          }

          if grep -RInF \
            --exclude='*.jks' \
            --exclude='*.keystore' \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.webp' \
            --exclude='*.gif' \
            --exclude='*.zip' \
            '0.13.17' Muwahid; then
            echo "ERROR: found old 0.13.17 reference inside project"
            exit 1
          fi

          if [ -f Muwahid/PROJECT_CHECKSUMS.sha256 ]; then
            (cd Muwahid && sha256sum -c PROJECT_CHECKSUMS.sha256)
          fi

          if [ -f Muwahid/VERIFY_PROJECT.sh ]; then
            VERIFY_OUTPUT="$(cd Muwahid && bash VERIFY_PROJECT.sh)"
            printf '%s\n' "$VERIFY_OUTPUT"
            printf '%s\n' "$VERIFY_OUTPUT" | grep -F "MW_SOURCE_OK 0.13.19"
          fi

          echo "MW_SOURCE_OK 0.13.19 CLEAN_NO_0.13.17"

      - name: Prepare stable signing
        env:
          MUWAHID_KEYSTORE_B64: ${{ secrets.MUWAHID_KEYSTORE_B64 }}
          MUWAHID_KEYSTORE_PASSWORD: ${{ secrets.MUWAHID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MUWAHID_KEYSTORE_B64:-}" ] && [ -n "${MUWAHID_KEYSTORE_PASSWORD:-}" ]; then
            printf '%s' "$MUWAHID_KEYSTORE_B64" | base64 --decode > Muwahid/muwahid-release.jks
            keytool -list -keystore Muwahid/muwahid-release.jks -storepass "$MUWAHID_KEYSTORE_PASSWORD" -alias muwahid >/dev/null
            echo "MUWAHID_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "MUWAHID_STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: cd Muwahid && gradle --no-daemon assembleDebug

      - name: Build signed release APK
        if: ${{ env.MUWAHID_STABLE_SIGNING == 'true' }}
        env:
          MUWAHID_KEYSTORE_PASSWORD: ${{ secrets.MUWAHID_KEYSTORE_PASSWORD }}
        run: cd Muwahid && gradle --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Muwahid-0.13.19-debug
          path: Muwahid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed APK
        if: ${{ env.MUWAHID_STABLE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Muwahid-APK-0.13.19
          path: Muwahid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
